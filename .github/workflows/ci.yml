name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Go engine: lint (golangci-lint), vet + test -race + tidy check, govulncheck.
  # Shared org workflow: https://github.com/fairbearlab/.github/blob/main/.github/workflows/go-ci.yml
  engine:
    uses: fairbearlab/.github/.github/workflows/go-ci.yml@5a38bfa7c85a7b57fe49b132068f5f20e1d9ac85 # v1
    with:
      working-directory: engine

  # Swift app: build the shipped (release) configuration, assemble the .app
  # bundle exactly as `make bundle` does, and upload it as a workflow artifact.
  app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: engine/go.mod
      - name: Build (release)
        run: swift build -c release
      - name: Bundle
        run: make bundle
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ChoosePaste.app
          path: build/ChoosePaste.app
          if-no-files-found: error
