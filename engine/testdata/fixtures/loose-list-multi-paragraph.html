<h2>Deployment Checklist</h2>
<ol>
<li>
<p>Run the test suite locally.</p>
<pre><code class="language-bash">make test</code></pre>
</li>
<li>
<p>Tag the release and push it to the registry.</p>
<p>Double-check the tag matches the version in <code>VERSION</code>.</p>
</li>
<li>
<p>Notify the on-call engineer before rolling out.</p>
</li>
</ol>
